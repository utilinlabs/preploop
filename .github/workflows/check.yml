name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: bun run format:check

      - name: Check types
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build application
        run: bun run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Validate version
        run: bun run version:check

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e # 1.96.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Install system dependencies
        uses: ./.github/actions/setup-linux-deps

      - name: Restore embedding model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: src-tauri/models/granite-r2-q8_0.gguf
          key: granite-r2-${{ hashFiles('scripts/fetch-model.ts') }}

      - name: Verify embedding model
        run: bun run model:fetch

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test release tooling
        run: bun run test:release

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets
